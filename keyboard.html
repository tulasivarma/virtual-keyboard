<!DOCTYPE html>
<head>
    <title>keyboard</title>
    <link rel="stylesheet" href="keyboard.css">

</head>
<body>  
    <header class="header">

        <div><h1>virtual keyboard</h1></div>
    </header>
<main class="main"> <input id="textbox" type="text" class="display"></main>
 
<div class="keyboard">
    <div class="keywords1">
        <button class="button1" id="onekey">`</button>
        <button class="button1">1</button>
        <button class="button1">2</button>
        <button class="button1">3</button>
        <button class="button1">4</button>
        <button class="button1">5</button>
        <button class="button1">6</button>
        <button class="button1">7</button>
        <button class="button1">8</button>
        <button class="button1">9</button>
        <button class="button1">0</button>
        <button class="button1" >-</button>
        <button class="button1">=</button>
        <button class="button1" id="Backspace">Backspace</button>
    </div>
    <div class="keywords2">
        <button class="button2" id="tab">Tab</button>
        <button class="button2">q</button>
        <button class="button2">w</button>
        <button class="button2">e</button>
        <button class="button2">r</button>
        <button class="button2">t</button>
        <button class="button2">y</button>
        <button class="button2">u</button>
        <button class="button2">i</button>
        <button class="button2">o</button>
        <button class="button2">p</button>
        <button class="button2">[</button>
        <button class="button2">]</button>
        <button class="button2">|</button>
    </div>
    <div class="keywords3">
        <button class="button3" id="caps">Caps</button>
        <button class="button3">a</button>
        <button class="button3">s</button>
        <button class="button3">d</button>
        <button class="button3">f</button>
        <button class="button3">g</button>
        <button class="button3">h</button>
        <button class="button3">j</button>
        <button class="button3">k</button>
        <button class="button3">l</button>
        <button class="button3">;</button>
        <button class="button3">'</button>
        <button class="button3" id="enter">Enter</button>
    </div>
    <div class="keywords4">
     <button class="button4" id="Shift">Shift</button>
     <button class="button4">z</button>
     <button class="button4">x</button>
     <button class="button4">c</button>
     <button class="button4">v</button>
     <button class="button4">b</button>
     <button class="button4">n</button>
     <button class="button4">m</button>
     <button class="button4">,</button>
     <button class="button4">.</button>
     <button class="button4">?</button>
     <button class="button4" id="Shift2" >Shift</button>
    </div>
<div class="keywords5"><button class="button5" id="Space">Space</button></div>

</body>
